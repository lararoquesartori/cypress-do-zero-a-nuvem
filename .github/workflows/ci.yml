#Esse é o Workflow de Integração Contínua (CI) do projeto. Ele é responsável por executar os testes automatizados do Cypress em cada push para o repositório.
name: End-to-end tests #nome do workflow
on: push #sempre que fizer o push ele ocorre
jobs:
  cypress-run:
    runs-on: ubuntu-22.04 
    steps:
      - name: Checkout 
        uses: actions/checkout@v4 #imagem, baixa o prjeto, git clone do projeto dentro do workspace la no git
      - name: Cypress run
        uses: cypress-io/github-action@v6 #executa os testes
        env: #chave secreta do Cypress
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
        with:
          command: npm run test:cloud #executa o comando npm run test:cloud, que está no package.json, que por sua vez executa o cypress run --record, que grava os testes na nuvem do Cypress
